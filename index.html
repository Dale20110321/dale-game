<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>自行车闯关 · 物理引擎版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:"Segoe UI",system-ui,sans-serif;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100vw;height:100vh;}
  #hud{position:absolute;top:14px;left:14px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;user-select:none;}
  #hud .lvl{font-size:22px;font-weight:700;}
  #hud .spd{font-size:16px;margin-top:2px;opacity:.95;}
  #hud .coins{font-size:16px;margin-top:2px;color:#ffd166;}
  #hud .prog{font-size:12px;margin-top:6px;opacity:.85;}
  #hud .bar{width:200px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:3px;overflow:hidden;}
  #hud .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#06d6a0,#ffd166);}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,20,32,.74);color:#fff;text-align:center;backdrop-filter:blur(2px);}
  #overlay.hidden{display:none;}
  #overlay h1{font-size:44px;letter-spacing:2px;margin-bottom:10px;}
  #overlay .sub{font-size:15px;opacity:.9;margin-bottom:16px;max-width:560px;line-height:1.7;}
  #overlay .keys{font-size:13px;opacity:.8;margin-bottom:4px;}
  #overlay .lvlDesc{font-size:14px;color:#ffd166;margin-top:16px;font-weight:600;}
  .btn{margin-top:16px;padding:12px 36px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#06d6a0,#118ab2);border:none;border-radius:30px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .btn:hover{filter:brightness(1.12);}
  .btn.ghost{background:rgba(255,255,255,.12);}
  #shop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,20,32,.88);color:#fff;text-align:center;z-index:30;}
  #shop.hidden{display:none;}
  #shop h2{font-size:30px;letter-spacing:1px;margin-bottom:4px;}
  #shop .upGold{font-size:22px;color:#ffd166;margin:6px 0 12px;}
  .upItm{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 18px;margin:6px 0;width:360px;max-width:92vw;}
  .upT{font-size:17px;font-weight:700;width:66px;text-align:left;}
  .upD{font-size:12px;opacity:.7;flex:1;text-align:left;}
  .upL{width:54px;color:#4cff88;font-weight:700;}
  #shop .btn.sm{padding:8px 16px;font-size:13px;margin:0;}
  #shop .upNote{font-size:13px;color:#ffd166;min-height:18px;margin:8px 0;}
  #toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:800;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.55);pointer-events:none;opacity:0;transition:opacity .4s;}
  #touch{position:absolute;inset:0;pointer-events:none;z-index:25;}
  #touch.hidden{display:none;}
  .tbtn{pointer-events:auto;position:absolute;bottom:42px;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:28px;border:2px solid rgba(255,255,255,.35);user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;}
  .tleft{left:18px;}
  .tright{right:18px;}
  .tdive{left:50%;transform:translateX(-50%);bottom:12px;width:62px;height:62px;font-size:22px;}
  .tfull{position:absolute;top:12px;right:12px;z-index:26;bottom:auto;width:46px;height:46px;font-size:18px;}
  .ttoggle{position:absolute;top:64px;right:12px;z-index:26;bottom:auto;width:44px;height:44px;font-size:17px;background:rgba(255,255,255,.12);}
  .ttoggle.on{background:rgba(80,255,150,.28);border-color:rgba(120,255,170,.65);}
  .tbtn:active{background:rgba(255,255,255,.42);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="touch" class="hidden">
    <button class="tbtn tleft" data-k="left" aria-label="刹车">◀</button>
    <button class="tbtn tright" data-k="right" aria-label="加速">▶</button>
    <button class="tbtn tdive" data-k="dive" aria-label="俯冲">▼</button>
  </div>
  <button id="fullBtn" class="tbtn tfull" aria-label="全屏">⛶</button>
  <button id="touchBtn" class="tbtn ttoggle" aria-label="方向键开关">🎮</button>
  <div id="hud">
    <div class="lvl" id="lvl">关卡 1</div>
    <div class="spd" id="speed">0 km/h</div>
    <div class="coins" id="coins">◎ 0</div>
    <div class="prog">进度</div>
    <div class="bar"><i id="prog"></i></div>
  </div>
  <div id="toast"></div>
  <div id="overlay">
    <h1>🚲 自行车闯关</h1>
    <div class="sub">两种模式任你选：闯关模式挑战更长赛道；自由模式无限畅骑，沿途收集金币升级车辆！</div>
    <div class="keys">→/D 加速 &nbsp;←/A 刹车 &nbsp;↓/S 俯冲 &nbsp;手机/平板用屏幕按钮 &nbsp;⛶ 全屏</div>
    <div class="lvlDesc" id="lvlDesc"></div>
    <button class="btn" id="startBtn">🏁 闯关模式</button>
    <button class="btn ghost" id="freeBtn">♾️ 自由模式</button>
    <button class="btn ghost" id="shopBtn">🔧 升级车间</button>
  </div>
  <div id="shop" class="hidden">
    <h2>🛠 升级车间</h2>
    <div class="upGold">🪙 金币 <span id="shopGold">0</span></div>
    <div class="upItm"><div class="upT">⚙️ 引擎</div><div class="upD">爬坡力 / 极速</div><div class="upL" id="lv-engine">Lv0</div><button class="btn sm" data-buy="engine">升级</button></div>
    <div class="upItm"><div class="upT">🛞 轮胎</div><div class="upD">抓地 / 防滑</div><div class="upL" id="lv-tire">Lv0</div><button class="btn sm" data-buy="tire">升级</button></div>
    <div class="upItm"><div class="upT">🛡️ 车架</div><div class="upD">耐摔</div><div class="upL" id="lv-frame">Lv0</div><button class="btn sm" data-buy="frame">升级</button></div>
    <div class="upItm"><div class="upT">🛠️ 减震</div><div class="upD">落地缓冲 / 更稳</div><div class="upL" id="lv-susp">Lv0</div><button class="btn sm" data-buy="susp">升级</button></div>
    <div class="upNote" id="shopNote"></div>
    <button class="btn" id="closeShop">返回</button>
  </div>
</div>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const HUD={lvl:document.getElementById("lvl"),speed:document.getElementById("speed"),
  coins:document.getElementById("coins"),prog:document.getElementById("prog"),
  lvlDesc:document.getElementById("lvlDesc")};
const overlay=document.getElementById("overlay"),toast=document.getElementById("toast");

let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// ---------------- 关卡 ----------------
// 20关：难度、路程、金币逐关递增（越到后面越难、越长、金币越多）
const LEVEL_NAMES=["平原热身","丘陵骑行","峡谷穿越","坡道试炼","山脊竞速","溪谷漂移","悬崖攀爬","高峰攀登","岩脊飞跃","雪线冲刺","云顶爬升","雷暴山道","峡谷深处","孤峰之路","断崖长廊","极峰挑战","星海赛道","天堑大桥","云端之巅","终极征服"];
const LEVELS=Array.from({length:20},(_,i)=>{
  const n=i+1;
  const amp=Math.round(60+i*24);           // 坡高 60→516
  const slopeBase=10+i*3.3;                // 基础坡度角 10°→72.7°
  const len=4000+i*400;                    // 路程递增 4000→11600
  const coinN=16+Math.floor(i*1.5);        // 金币递增 16→44
  const nP=2+Math.floor(i/2);              // 山峰数量递增 2→11（每峰=上坡+回坡）
  const steps=[];
  for(let r=0;r<nP;r++){
    const deg=Math.min(60,slopeBase+4*r);  // 关内坡度递增（上限60°可真爬，垂直墙会弹飞）
    const h=Math.round(amp*(0.55+0.45*r/nP));
    const w=Math.max(14,Math.round(h/Math.tan(deg*Math.PI/180)));
    const cx=Math.round(len*(0.16+0.7*r/nP));
    steps.push({cx,A:h,w});            // 上坡
    steps.push({cx:cx+Math.max(w*2,40),A:-h,w}); // 回坡（净偏移=0，基线恒定）
  }
  return {name:LEVEL_NAMES[i],amp,wk:1+i*0.05,len,gapN:i<3?0:Math.min(4,1+Math.floor((i-3)/3)),ramps:[],steps,coinN,maxS:600+i*20,seed:11+i*7};
});
let lvIdx=0,finishX=0,gaps=[],coins=[],decoTree=[],decoRock=[];
const SEED=new Map();

function hillY(x){const L=LEVELS[lvIdx];
  // 前12%平地起步，随后平滑过渡到台地陡坡（tanh 天然无尖角）
  const progress=clamp((x-L.len*0.12)/(L.len*0.6),0,1);
  const ease=progress*progress*(3-2*progress);
  let y=300;
  for(const s of L.steps)y+=s.A*Math.tanh((x-s.cx)/s.w);
  return 300+(y-300)*ease;}
function featH(x){return 0;}
function isGap(x){for(const g of gaps)if(x>g.start&&x<g.end)return g;return null;}
function groundY(x){if(isGap(x))return Infinity;return hillY(x)-featH(x);}
function groundInfo(x){const e=2;if(isGap(x))return{y:Infinity,m:0};
  const y0=groundY(x),yL=groundY(x-e),yR=groundY(x+e),m=(yR-yL)/(2*e);return{y:y0,m};}

function buildLevel(idx){
  lvIdx=idx;const L=LEVELS[idx];const rng=mulberry32(1000+idx*97);
  finishX=L.len;gaps=[];coins=[];
  let placed=0,g=0;
  while(placed<L.gapN&&g++<300){const gx=L.len*0.3+rng()*(L.len*0.6);
    // 裂缝避开陡坡台地，放平缓段（靠下坡冲劲或过顶飞跃越过）
    const nearStep=L.steps.some(s=>Math.abs(gx-s.cx)<s.w*1.5);
    if(!nearStep){const gw=Math.min(150,50+idx*5+rng()*20);gaps.push({start:gx,end:gx+gw});placed++;}}
  gaps.sort((a,b)=>a.start-b.start);
  for(let i=0;i<L.coinN;i++){const cx=L.len*0.15+i*(L.len*0.75)/(L.coinN-1);
    coins.push({x:cx,y:groundY(cx)-35,taken:false,ph:rng()*6.28});}
  // 装饰树/石
  decoTree=[];decoRock=[];
  let p=L.len*0.12;
  while(p<L.len-60){p+=140+rng()*160;if(!isGap(p)){if(rng()<0.55)decoTree.push({x:p});else decoRock.push({x:p});}}
}

// ---------------- 物理 ----------------
const G=1000,SUB=6,DT=1/60,WHEEL_R=12,WHEELBASE=38,SEAT_H=26;
let DRIVE=650,BRAKE=120,JUMP_V=340,LAMP_STUN=0.9,MAXV=130;
let slopeCoeff=0.35,rollCoeff=0.62,crashMargin=2;
let susAbsorb=0.25,susClimb=6,susRot=0.70;
let gold=0,upgrades={engine:0,tire:0,frame:0,susp:0};
const MAX_LV=100;
function upCost(lv){return 30+lv*5;} // 100级价格：Lv1=35 → Lv100=530
function applyUpgrades(){
  // 100级：引擎爬坡+极速；轮胎牵引+极速；车架耐摔；减震落地缓冲
  DRIVE=650+25*upgrades.engine+20*upgrades.tire;
  MAXV=Math.min(350,130+2.5*upgrades.engine+1.5*upgrades.tire);
  crashMargin=Math.min(12,2+0.1*upgrades.frame);
  LAMP_STUN=Math.max(0.3,0.9-0.006*upgrades.frame);
  const sus=upgrades.susp||0;
  susAbsorb=Math.max(0.05,0.25-0.002*sus);
  susClimb=Math.max(1,6-0.05*sus);
  susRot=Math.max(0.30,0.70-0.004*sus);
}
const bike={rear:{x:0,y:0,px:0,py:0},front:{x:0,y:0,px:0,py:0},head:{x:0,y:0,px:0,py:0},
  grounded:0,speed:0,stunned:0,impact:0,wheelRear:0,wheelFront:0,locked:true,spawnX:40,
  frontGr:false,rearGr:false,squash:0,airT:0,lastAng:0};

function resetBike(x){const L=WHEELBASE;
  bike.spawnX=x;bike.locked=true;
  const yR=groundY(x)-WHEEL_R,yF=groundY(x+L)-WHEEL_R;
  const ang=Math.atan2(yF-yR,L);
  bike.rear={x:x,y:yR,px:x,py:yR};
  bike.front={x:x+L,y:yF,px:x+L,py:yF};
  const hx=x+L/2-Math.sin(ang)*SEAT_H,hy=(yR+yF)/2-Math.cos(ang)*SEAT_H;
  bike.head={x:hx,y:hy,px:hx,py:hy};
  bike.grounded=0;bike.speed=0;bike.stunned=0;bike.impact=0;bike.wheelRear=0;bike.wheelFront=0;
  bike.frontGr=false;bike.rearGr=false;bike.squash=0;bike.airT=0;bike.lastAng=Math.atan2(bike.front.y-bike.rear.y,bike.front.x-bike.rear.x);}

const key={left:false,right:false,jump:false,dive:false,jumpQueued:false};
function bind(e,d){let c=null;
  const k=(e.key||"").toLowerCase();
  if(e.code==="ArrowRight"||e.key==="ArrowRight"||k==="d")c="right";
  else if(e.code==="ArrowLeft"||e.key==="ArrowLeft"||k==="a")c="left";
  else if(e.code==="ArrowDown"||e.key==="ArrowDown"||k==="s")c="dive";
  if(c)key[c]=d;}
addEventListener("keydown",e=>{initAudio();if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();bind(e,true);});
addEventListener("keydown",e=>{if(e.code==="Minus"||e.code==="Equal"){e.preventDefault();const z=clamp(zoom+(e.code==="Equal"?0.15:-0.15),0.6,2.5);if(z!==zoom){zoom=z;showToast("缩放 "+Math.round(zoom*100)+"%",600);}}});
addEventListener("keydown",e=>{if(e.code==="KeyR"&&(state==="play"||state==="ended")){e.preventDefault();startGame();showToast("🔄 重新开始",500);}});
addEventListener("keydown",e=>{if(e.code==="KeyT"&&state==="play"&&mode!=="free"){e.preventDefault();nextLevel();}});
addEventListener("keydown",e=>{if(e.code==="KeyU"){e.preventDefault();if(shopOpen)closeShop();else openShop();}});
addEventListener("keyup",e=>bind(e,false));
addEventListener("blur",()=>{key.left=key.right=key.jump=key.dive=false;});

let crashed=false,crashTimer=0,playing=false,clearing=false,lastSafeX=40;

function stepPhysics(){
  const L=WHEELBASE,HH=SEAT_H,Lr=Math.hypot(L*0.5,HH);
  const aDrive=key.right&&!crashed?DRIVE:0, aBrake=key.left&&!crashed?BRAKE:0;
  const leaning=key.dive&&!crashed?1:0;
  const prevGrounded=bike.grounded;

  for(let s=0;s<SUB;s++){
    const sub=DT/SUB,sq=sub*sub;
    const P=[bike.rear,bike.front,bike.head];
    for(const p of P){const vx=p.x-p.px,vy=p.y-p.py;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy;}
    for(const p of P){p.y+=G*sq;}
    // 驱动力：三质点一致 → 无翘头力矩，起步平稳
    if(aDrive||aBrake){const a=(aDrive-aBrake);
      bike.rear.x+=a*sq;bike.front.x+=a*sq;bike.head.x+=a*sq;}
    // 俯冲/重心前移
    if(leaning){bike.head.x+=5200*sq;bike.head.y+=1800*sq;}
    // 贴地判定（12px 吸附带）；空中状态不禁吸附
    const FS=groundInfo(bike.front.x).y-WHEEL_R, RS=groundInfo(bike.rear.x).y-WHEEL_R;
    if(bike.airT>0){
      bike.frontGr=false;bike.rearGr=false;bike.airT--;
      // 飞离足够远转普通检测；或真实跌入地面6px以上立即结束
      if((bike.front.y<FS-14||bike.rear.y<RS-14)||(bike.front.y>FS+6||bike.rear.y>RS+6))bike.airT=0;
    }else{
      bike.frontGr=(bike.front.y>FS-12);bike.rearGr=(bike.rear.y>RS-12);
    }
    // 刚性约束：贴地轮 y 锚定（防约束抬轮），离地轮全自由度
    for(let it=0;it<6;it++){
      // rear-front
      let dx=bike.front.x-bike.rear.x,dy=bike.front.y-bike.rear.y;
      let d=Math.hypot(dx,dy)||1e-4,diff=(d-L)/d;
      if(bike.rearGr&&bike.frontGr){
        const err=diff*dx*0.5;
        bike.rear.x+=err;bike.front.x-=err;
      }else if(bike.rearGr){
        bike.front.x-=dx*diff;bike.front.y-=dy*diff;
      }else if(bike.frontGr){
        bike.rear.x+=dx*diff;bike.rear.y+=dy*diff;
      }else{
        bike.rear.x+=dx*diff*0.5;bike.rear.y+=dy*diff*0.5;
        bike.front.x-=dx*diff*0.5;bike.front.y-=dy*diff*0.5;
      }
      // head-rear
      dx=bike.head.x-bike.rear.x;dy=bike.head.y-bike.rear.y;d=Math.hypot(dx,dy)||1e-4;diff=(d-Lr)/d;
      if(bike.rearGr){
        bike.head.x-=dx*diff;bike.head.y-=dy*diff;
      }else{
        bike.rear.x+=dx*diff*0.5;bike.rear.y+=dy*diff*0.5;
        bike.head.x-=dx*diff*0.5;bike.head.y-=dy*diff*0.5;
      }
      // head-front
      dx=bike.head.x-bike.front.x;dy=bike.head.y-bike.front.y;d=Math.hypot(dx,dy)||1e-4;diff=(d-Lr)/d;
      if(bike.frontGr){
        bike.head.x-=dx*diff;bike.head.y-=dy*diff;
      }else{
        bike.front.x+=dx*diff*0.5;bike.front.y+=dy*diff*0.5;
        bike.head.x-=dx*diff*0.5;bike.head.y-=dy*diff*0.5;
      }
    }
    // 约束后压回贴地轮 + 沿坡滚动（空中不吸附）
    bike.grounded=0;bike.impact=0;
    if(bike.airT<=0)for(const [p,srf,flag] of [[bike.rear,RS,"rearGr"],[bike.front,FS,"frontGr"]]){
      bike[flag]=(p.y>srf-12);
      if(p.y>srf-60){ // 轮子在坡面上方60px内即开始吸附（爬陡坡不悬空飞行）
        // 重力沿坡：下坡自然加速、上坡减速（真实物理）
        const ginfo=groundInfo(p.x);
        if(ginfo.y!==Infinity){
          p.x+=(G*ginfo.m/Math.hypot(1,ginfo.m))*0.55*sq;
          // 极陡(45°+)轻微阻尼：防高速冲坡弹飞，不影响正常爬坡
          if(ginfo.m<-1.0)p.px+=(p.x-p.px)*0.01;
        }
        const depth=p.y-srf;
        if(depth>8){
          // 压入坡面较深（陡坡/尖峰）：平滑爬升，吸收上行动量，贴坡不弹飞
          p.y=Math.max(srf,p.y-susClimb);
          const vy=p.y-p.py;
          if(vy<0){p.py=p.y;}else if(vy>0){p.py=p.y-vy*susAbsorb;}
        }else if(depth<-8){
          // 越过坡顶/下坡悬空：平滑下放（吸收向下动量），防突然拉回
          p.y=Math.min(srf,p.y+susClimb);
          const vy=p.y-p.py;
          if(vy>0)p.py=p.y-vy*susAbsorb;
        }else{
          // 正常贴地/落地：直接压回 + 吸收冲击（防弹跳）
          const vy=p.y-p.py;
          if(vy>0)p.py=p.y-vy*susAbsorb;
          p.y=srf;
        }
        bike.grounded++;
      }
    }
    // 落地防栽头：两轮贴地时把骑手重心温和摆回车架中垂线上方
    if(bike.grounded>=2&&!crashed){
      const a2=Math.atan2(bike.front.y-bike.rear.y,L);
      const my2=(bike.rear.y+bike.front.y)/2, mx2=(bike.rear.x+bike.front.x)/2;
      bike.head.x+=(mx2-SEAT_H*Math.sin(a2)-bike.head.x)*0.35;
      bike.head.y+=(my2-SEAT_H*Math.cos(a2)-bike.head.y)*0.35;
    }
    // 车架旋转限制：每子步角度变化超限则绕后轮回拨（刚体旋转，物理一致，防旋转突变）
    const angN=Math.atan2(bike.front.y-bike.rear.y,bike.front.x-bike.rear.x);
    let dA=angN-bike.lastAng;
    while(dA>Math.PI)dA-=2*Math.PI;
    while(dA<-Math.PI)dA+=2*Math.PI;
    const MAXDA=0.08;
    if(Math.abs(dA)>MAXDA){
      const back=angN-Math.sign(dA)*(Math.abs(dA)-MAXDA)*0.85;
      const rot=back-angN,c=Math.cos(rot),s=Math.sin(rot);
      for(const p of [bike.front,bike.head]){
        const dx=p.x-bike.rear.x,dy=p.y-bike.rear.y;
        p.x=bike.rear.x+dx*c-dy*s;p.y=bike.rear.y+dx*s+dy*c;
      }
      bike.lastAng=back;
    }else{
      bike.lastAng=angN;
    }
    // 旋转阻尼：衰减骑手绕车架中点的切向速度 → 翘头/前倾/碰撞旋转平缓
    const mxh=(bike.rear.x+bike.front.x)/2,myh=(bike.rear.y+bike.front.y)/2;
    const dxh=bike.head.x-mxh,dyh=bike.head.y-myh;
    const disth=Math.hypot(dxh,dyh)||1e-4;
    const txx=-dyh/disth,tyy=dxh/disth;
    const hvx=bike.head.x-bike.head.px,hvy=bike.head.y-bike.head.py;
    const vt=hvx*txx+hvy*tyy;
    const vr=vt*(bike.grounded>0?susRot:0.40);
    bike.head.px=bike.head.x-(hvx-(vt-vr)*txx);
    bike.head.py=bike.head.y-(hvy-(vt-vr)*tyy);
    // 头管着地摔车
    const hgi=groundInfo(bike.head.x);
    if(hgi.y!==Infinity&&bike.head.y>hgi.y-crashMargin&&!crashed)crash();
  }
  // 落地减震压缩（从空中到落地瞬间）
  if(prevGrounded===0&&bike.grounded>0&&!crashed)bike.squash=0.85;
  bike.squash=Math.max(0,bike.squash-0.02);
  // 引擎刹车：松油门且贴地时自然减速（平路/上坡）；下坡不刹车，交给重力加速
  if(!aDrive&&!aBrake&&bike.grounded>0&&groundInfo(bike.front.x).m<=0.03){
    const dec=0.12;
    bike.rear.px+=(bike.rear.x-bike.rear.px)*dec;
    bike.front.px+=(bike.front.x-bike.front.px)*dec;
    bike.head.px+=(bike.head.x-bike.head.px)*dec;
  }
  // 垂直速度上限（防陡坡抛射式起飞/无限下落）
  const cvy=(bike.front.y-bike.front.py)/DT;
  if(Math.abs(cvy)>500){
    const lim=500*Math.sign(cvy);
    bike.front.py=bike.front.y-lim*DT;bike.rear.py=bike.rear.y-lim*DT;bike.head.py=bike.head.y-lim*DT;
  }
  // 速度上限（防数值爆炸）：上坡提前软减速，冲坡动量平滑吸收
  let vh=(bike.front.x-bike.front.px)/DT;
  const gmG=groundInfo(bike.front.x);
  if(gmG.y!==Infinity&&gmG.m<0){
    const vT=Math.max(60,MAXV/(1+(-gmG.m)*1.3));
    if(vh>vT)vh=vT+(vh-vT)*0.10;
  }
  if(vh>MAXV){vh=MAXV;}else if(vh<-MAXV){vh=-MAXV;}
  if(vh!==(bike.front.x-bike.front.px)/DT){
    bike.front.px=bike.front.x-vh*DT;bike.rear.px=bike.rear.x-vh*DT;bike.head.px=bike.head.x-vh*DT;
  }
  bike.speed=lerp(bike.speed,(bike.front.x-bike.front.px)/DT,0.12);
  bike.wheelRear+=(bike.rear.x-bike.rear.px)/DT*(1/WHEEL_R)*0.06;
  bike.wheelFront+=(bike.front.x-bike.front.px)/DT*(1/WHEEL_R)*0.06;
  if(bike.stunned>0)bike.stunned-=DT;
}

// ---------------- 粒子系统 ----------------
let particles=[];
function emitParticles(x,y,count,cfg){
  for(let i=0;i<count;i++){const a=Math.random()*6.2832,s=0.5+Math.random()*1.5;
    particles.push({x,y,vx:Math.cos(a)*s*cfg.spd,vy:Math.sin(a)*s*cfg.spd-0.5,
      life:cfg.life||40,maxLife:cfg.life||40,size:cfg.size||2+Math.random()*2,
      color:cfg.color||"#fff",decay:cfg.decay||0.97,grav:cfg.grav||0.04});}}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=p.decay;p.vy*=p.decay;
    p.life--;if(p.life<=0||p.y>H*2)particles.splice(i,1);}}
function drawParticles(cx,cy){
  for(const p of particles){const sx=p.x-cx,sy=p.y-cy;
    if(sx<-50||sx>W+50)continue;
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy,p.size*a,0,7);ctx.fill();}
  ctx.globalAlpha=1;}

// ---------------- 音效（Web Audio API） ----------------
let audioCtx=null,audioInit=false;
function initAudio(){if(audioInit)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioInit=true;}catch(e){}}
function playTone(freq,dur,type,gain){
  if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||"square";o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    g.gain.setValueAtTime((gain||0.08),audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function playCoinSound(){playTone(880,0.12,"sine",0.1);setTimeout(()=>playTone(1320,0.15,"sine",0.08),80);}
function playCrashSound(){playTone(120,0.3,"sawtooth",0.12);playTone(80,0.4,"square",0.08);}
function playLandSound(){playTone(200,0.1,"sine",0.06);}
function playJumpSound(){playTone(400,0.08,"sine",0.06);setTimeout(()=>playTone(500,0.08,"sine",0.05),50);}

let bikeAngle=0, maxWheelieDist=0, wheelieDist=0, airTime=0, landed=false;

  const ang=Math.atan2(bike.front.y-bike.rear.y,bike.front.x-bike.rear.x);
  bikeAngle=ang;
  const frontGround=groundInfo(bike.front.x);
  const frontOffGround=(frontGround.y===Infinity||bike.front.y<frontGround.y-WHEEL_R-2);
  if(bike.grounded>0&&frontOffGround&&!crashed){wheelieDist+=Math.abs(bike.speed)*0.016;maxWheelieDist=Math.max(maxWheelieDist,wheelieDist);}

}

// ---------------- 绘制 ----------------
function skyAndBg(cx,cy){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#7ec8f7");g.addColorStop(0.7,"#cdeffd");g.addColorStop(1,"#eef8fc");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,230,150,.95)";ctx.beginPath();ctx.arc(W-120,90,40,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.75)";
  for(let i=0;i<6;i++){const bw=120+(i%3)*30,bx=((i*260-(cx*0.2)%W)%W+W)%W,by=60+(i%3)*40;
    ctx.beginPath();ctx.ellipse(bx,by,bw,bw*0.32,0,0,7);ctx.fill();}
  ctx.fillStyle="#9cc5e0";ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8){const wy=H*0.62-Math.sin((x+cx*0.4)*0.01)*46-Math.sin((x+cx*0.4)*0.03)*22;ctx.lineTo(x,wy);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

function drawTerrain(cx,cy){
  const colors=[["#3f7d3a","#58a24f","#8b5e3c"],["#5a7a3a","#6d9a4a","#9a7a4a"],["#4a5a6a","#6a7a8a","#6a5a4a"]];
  const pal=colors[lvIdx%colors.length];
  ctx.fillStyle=pal[0];ctx.beginPath();ctx.moveTo(0,cy);
  for(let x=0;x<=W;x+=6){const wx=x+cx;const gy=groundY(wx);if(gy===Infinity){ctx.lineTo(x,cy);}else ctx.lineTo(x,gy-cy);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=pal[1];ctx.beginPath();
  for(let x=0;x<=W;x+=6){const gy=groundY(x+cx);if(gy===Infinity)continue;ctx.lineTo(x,gy-cy-8);}
  ctx.strokeStyle=pal[1];ctx.lineWidth=8;ctx.stroke();
  ctx.fillStyle="rgba(0,0,0,.08)";ctx.beginPath();
  ctx.moveTo(0,cy);for(let x=0;x<=W;x+=6){const gy=groundY(x+cx);if(gy===Infinity){ctx.lineTo(x,cy);}else ctx.lineTo(x,Math.min(gy+40,cy+H)-cy);}
  ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.lineWidth=1.5;
  for(let x=0;x<=W;x+=18){const wx=x+cx;const gy=groundY(wx);if(gy===Infinity)continue;const y=gy-cy;
    for(let i=0;i<3;i++){const ox=Math.sin(wx*0.5+i*2)*4;ctx.beginPath();ctx.moveTo(x+ox-2,y-8);ctx.lineTo(x+ox,y-14-i*2);ctx.stroke();}}
}
function drawSpeedLines(){
  if(Math.abs(bike.speed)<80||crashed)return;
  const intens=clamp(Math.abs(bike.speed)/300,0,0.3);
  ctx.strokeStyle=`rgba(255,255,255,${intens})`;ctx.lineWidth=1.5;
  for(let i=0;i<12;i++){const x=Math.random()*W,y=Math.random()*H*0.6,l=10+Math.random()*25;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-l*Math.sign(bike.speed),y);ctx.stroke();}
}

function drawDeco(cx,cy){

  for(const r of decoRock){const sx=r.x-cx;if(sx<-40||sx>W+40)continue;const gy=groundY(r.x);if(gy===Infinity)continue;const y=gy-cy;

  ctx.fillStyle="#fff";ctx.font="11px sans-serif";ctx.textAlign="right";ctx.fillText("终点",sx-6,y-118);ctx.textAlign="left";

function drawBike(){
  const P=bike;const cxm=(P.rear.x+P.front.x)/2,cym=(P.rear.y+P.front.y)/2;
  const ang=Math.atan2(P.front.y-P.rear.y,P.front.x-P.rear.x);
  ctx.save();ctx.translate(cxm-camX,cym-camY);ctx.rotate(ang);
  const hw=WHEELBASE*0.5,hr=SEAT_H;
  // 车架 + 减震效果（squash：落地压缩→回弹）
  ctx.strokeStyle="#314ccd";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-hw,0);ctx.lineTo(0,-hr*0.55);ctx.lineTo(hw,0);ctx.moveTo(-hw,0);ctx.lineTo(-hw*0.2,-hr*0.72);ctx.moveTo(hw,0);ctx.lineTo(hw*0.5,-hr*0.75);ctx.stroke();
  // 前后减震：压缩时橙色虚线
  const sq2=bike.squash||0;
  ctx.strokeStyle=`rgba(255,${Math.round(210-sq2*160)},${Math.round(60-sq2*40)},${0.35+sq2*0.65})`;
  ctx.lineWidth=2;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(-hw*0.2,-hr*0.72);ctx.lineTo(0,-hr*0.55);ctx.moveTo(hw*0.5,-hr*0.75);ctx.lineTo(0,-hr*0.55);ctx.stroke();
  ctx.setLineDash([]);
  // 座椅在后轮上方
  ctx.fillStyle="#222";ctx.fillRect(-hw-2,-hr*0.8-4,10,4);
  // 车把
  ctx.strokeStyle="#333";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hw*0.5,-hr*0.75);ctx.lineTo(hw*0.62,-hr*1.0);ctx.stroke();
  ctx.fillStyle="#e88c1f";ctx.fillRect(hw*0.42,-hr*1.0,12,3);
  // 轮子
  for(const [off,spin] of [[-hw,P.wheelRear],[hw,P.wheelFront]]){
    ctx.strokeStyle="#2a2a2a";ctx.lineWidth=4;ctx.beginPath();ctx.arc(off,0,WHEEL_R,0,7);ctx.stroke();
    ctx.strokeStyle="#c0392b";ctx.lineWidth=3;ctx.beginPath();ctx.arc(off,0,WHEEL_R-1.5,0,7);ctx.stroke();
    ctx.strokeStyle="#666";ctx.lineWidth=2;ctx.beginPath();
    const r=WHEEL_R-3,ph=spin;
    for(let i=0;i<4;i++){const a=i*Math.PI/2+ph;ctx.moveTo(off,0);ctx.lineTo(off+Math.cos(a)*r,Math.sin(a)*r);}
    ctx.stroke();
    ctx.fillStyle="#555";ctx.beginPath();ctx.arc(off,0,2.6,0,7);ctx.fill();
  }
  // 骑手（落地时随减震轻微下沉）
  const glyphY=-hr*0.72-2*(bike.squash||0);
  ctx.strokeStyle="#f4a259";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-hw*0.2,glyphY);ctx.lineTo(hw*0.5,glyphY-8);ctx.stroke();
  ctx.fillStyle="#2e7d64";
  ctx.beginPath();ctx.ellipse(-4,glyphY-6,9,11,0,0,7);ctx.fill();
  ctx.fillStyle="#ffcba5";
  ctx.beginPath();ctx.arc(-2,glyphY-22,7,0,7);ctx.fill();
  ctx.fillStyle="#e63946";
  ctx.beginPath();ctx.arc(-2,glyphY-25,7.5,Math.PI,0);ctx.fill();
  ctx.strokeStyle="#333";ctx.lineWidth=3;
  const pda=(P.wheelRear*0.3);
  ctx.beginPath();ctx.moveTo(-hw*0.35,Math.cos(0+pda)*6);ctx.lineTo(-hw*0.35,Math.sin(0+pda)*6);ctx.stroke();
  ctx.restore();
}

    const btn=document.querySelector('[data-buy="'+k+'"]');
    if(lv>=MAX_LV){btn.textContent="已满级";btn.disabled=true;btn.style.opacity=.5;}
    else{const c=upCost(lv+1);btn.textContent="升级 "+c+" 🪙";btn.disabled=gold<c;}
  }
}
function buyUpgrade(k){
  const lv=upgrades[k];
  if(lv>=MAX_LV)return;
  const c=upCost(lv+1);
  if(gold<c){document.getElementById("shopNote").textContent="金币不足，去关卡里收集吧！";return;}
  gold-=c;upgrades[k]=lv+1;applyUpgrades();save();renderShop();
  document.getElementById("shopNote").textContent="升级成功！";
  playCoinSound();
}
function loadSave(){
  try{gold=parseInt(localStorage.getItem("bike_gold")||"0",10)||0;
    const u=JSON.parse(localStorage.getItem("bike_up")||"{}");
    upgrades.engine=Math.min(MAX_LV,u.engine||0);upgrades.tire=Math.min(MAX_LV,u.tire||0);upgrades.frame=Math.min(MAX_LV,u.frame||0);upgrades.susp=Math.min(MAX_LV,u.susp||0);
    // 旧存档迁移：金币单位×10（版本1→2）
    if(localStorage.getItem("bike_v")!=="2"){gold*=10;localStorage.setItem("bike_v","2");save();}
  }catch(e){}
  applyUpgrades();
}
function save(){try{localStorage.setItem("bike_gold",gold);localStorage.setItem("bike_up",JSON.stringify(upgrades));}catch(e){}}
document.getElementById("shopBtn").addEventListener("click",()=>{initAudio();openShop();});
document.getElementById("closeShop").addEventListener("click",closeShop);
for(const k of ["engine","tire","frame","susp"])document.querySelector('[data-buy="'+k+'"]').addEventListener("click",()=>buyUpgrade(k));
loadSave();

// ---------------- 自由模式 ----------------
function freeInit(){
  mode="free";lvIdx=0;finishX=Infinity;gaps=[];coins=[];decoTree=[];decoRock=[];freeGenX=0;clearing=false;
}
function freeFill(){
  const viewR=camX+W*2;let guard=0;
  while(freeGenX<viewR&&guard++<200){
    freeGenX+=70+Math.random()*200;
    if(!isGap(freeGenX)){
      if(Math.random()<0.8)coins.push({x:freeGenX,y:groundY(freeGenX)-30,taken:false,ph:Math.random()*6.28});
      if(Math.random()<0.5)decoTree.push({x:freeGenX});else decoRock.push({x:freeGenX});
    }
  }
  coins=coins.filter(c=>c.x>camX-400&&!c.taken);
  decoTree=decoTree.filter(t=>t.x>camX-400);
  decoRock=decoRock.filter(r=>r.x>camX-400);
}

// ---------------- 主循环 ----------------
let camX=0,camY=0,zoom=1.4,state="menu",lastT=0,time=0;
let mode="level",lastMode="level",freeGenX=0;

function showToast(txt,ms){toast.textContent=txt;toast.style.opacity=1;toast.style.transition="none";setTimeout(()=>{toast.style.transition="opacity .4s";toast.style.opacity=0;},ms||900);}

function startGame(m){
  lastMode=m||lastMode;mode=lastMode;
  overlay.children[1].textContent="两种模式任你选：闯关模式挑战更长赛道；自由模式无限畅骑，沿途收集金币升级车辆！";
  if(mode==="free"){freeInit();}else{buildLevel(0);}
  resetBike(40);crashed=false;camX=0;particles=[];
  maxWheelieDist=0;airTime=0;wheelieDist=0;landed=false;
  HUD.coins.textContent="◎ "+gold;state="play";overlay.classList.add("hidden");
}
document.getElementById("startBtn").addEventListener("click",()=>{
  initAudio();if(state==="menu"||state==="ended"){startGame("level");}});
document.getElementById("freeBtn").addEventListener("click",()=>{
  initAudio();if(state==="menu"||state==="ended"){startGame("free");}});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;let rawDt=clamp((t-lastT)/1000,0,1/30);lastT=t;
  time+=rawDt;
  if(state==="play"&&!shopOpen){
    if(bike.locked){
      if(key.right||key.left||key.dive){bike.locked=false;}
      else {
        bike.rear.x=bike.spawnX;bike.front.x=bike.spawnX+WHEELBASE;bike.head.x=bike.spawnX+WHEELBASE*0.5;
        rawDt=0;
      }
    }
    if(!bike.locked){
      stepPhysics();updateParticles();emitRideDust();updateStats();
      if(crashed){crashTimer-=rawDt;if(crashTimer<=0){respawn();}}
      const mid=(bike.rear.x+bike.front.x)/2;
      const midY=(bike.rear.y+bike.front.y)/2;
      if(bike.grounded>0&&!crashed)lastSafeX=mid;
      if(!crashed&&midY>H*3){pitRewind();}
      updateCoins();
      if(mode==="free"){freeFill();}
      else if(!clearing&&(bike.rear.x+bike.front.x)/2>finishX){
        clearing=true;gold+=150;save();showToast("🏁 通关！🪙+150");setTimeout(()=>nextLevel(),800);
      }
    }
  }
  // 相机
  const mx=(bike.rear.x+bike.front.x)/2,my=(bike.rear.y+bike.front.y)/2;
  const targetX=clamp(mx-W*0.38/zoom,0,Math.max(0,finishX-W*0.45/zoom));
  const targetY=my-H*0.55/zoom;
  camX=lerp(camX,targetX,0.10);camY=lerp(camY,targetY,0.12);

  // 绘制
  skyAndBg(camX,camY);
  ctx.save();
  ctx.scale(zoom,zoom);
  drawParticles(camX,camY);
  drawDeco(camX,camY);
  drawTerrain(camX,camY);
  drawCoins(camX,camY);
  drawFlag(camX,camY);
  if(state==="play"||state==="ended")drawBike();
  ctx.restore();

  if(state==="play"){drawBalanceBar();drawDriveIndicator();drawSpeedLines();}

  ctx.fillStyle="rgba(255,255,255,0.5)";ctx.font="11px sans-serif";ctx.textAlign="right";
  ctx.fillText("缩放 "+Math.round(zoom*100)+"%  ·  R重启  ·  +/-缩放",W-12,H-12);
  ctx.textAlign="left";

  HUD.speed.textContent=Math.round(Math.abs(bike.speed)*0.12)+" km/h"+(airTime>0.1?" ✈ "+Math.round(airTime*10)/10+"s":"");
  if(mode==="free"){
    HUD.lvl.textContent="♾ 自由模式 · "+Math.round(mx/10)+"m";
    HUD.prog.style.width="100%";
    HUD.prog.parentNode.style.opacity=0.3;
  }else{
    HUD.lvl.textContent="关卡 "+(lvIdx+1)+" · "+LEVELS[lvIdx].name;
    HUD.prog.style.width=clamp((mx/finishX)*100,0,100)+"%";
    HUD.prog.parentNode.style.opacity=1;
  }
  if(state==="menu")HUD.lvlDesc.textContent="闯关模式 · "+LEVELS[lvIdx].name+"（"+(LEVELS[lvIdx].len/100)+"米）/ 自由模式无限赛道";
}
// 触摸控制与全屏（手机/平板）
if(('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0){document.getElementById("touch").classList.remove("hidden");document.getElementById("touchBtn").classList.add("on");}
document.getElementById("touchBtn").addEventListener("click",()=>{
  const tEl=document.getElementById("touch");
  tEl.classList.toggle("hidden");
  document.getElementById("touchBtn").classList.toggle("on",!tEl.classList.contains("hidden"));
});
document.querySelectorAll(".tbtn[data-k]").forEach(b=>{
  const k=b.dataset.k;
  const on=ev=>{ev.preventDefault();key[k]=true;};
  const off=ev=>{ev.preventDefault();key[k]=false;};
  b.addEventListener("touchstart",on,{passive:false});
  b.addEventListener("touchend",off,{passive:false});
  b.addEventListener("touchcancel",off,{passive:false});
  b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
});
document.getElementById("fullBtn").addEventListener("click",()=>{
  const d=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else if(d.requestFullscreen){d.requestFullscreen();}
  else if(d.webkitRequestFullscreen){d.webkitRequestFullscreen();}
});

// 启动初始化：构建第一关（让菜单显示正确目标距离）并同步金币显示
buildLevel(0);
HUD.coins.textContent="◎ "+gold;
requestAnimationFrame(loop);
</script>
</body>
</html>
