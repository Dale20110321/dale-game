<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>自行车越野 · 真实物理版</title>
<meta name="description" content="原生 JavaScript + Canvas 的物理越野自行车游戏：闯关 / 比赛 / 无限模式，三质点刚体物理、燃料、特技与成就。">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="touch" class="hidden">
    <button class="tbtn tleft" data-k="left" aria-label="刹车 / 空中逆时针转体">◀</button>
    <button class="tbtn tright" data-k="right" aria-label="加速 / 空中顺时针转体">▶</button>
  </div>
  <button id="fullBtn" class="tbtn tfull" aria-label="全屏">⛶</button>
  <button id="touchBtn" class="tbtn ttoggle" aria-label="方向键开关">🎮</button>
  <button id="btnHomeFloat" class="tbtn thome" aria-label="返回主页">🏠</button>

  <div id="comboTag"></div>
  <div id="toast"></div>

  <div id="overlay">
    <div id="menuBg" aria-hidden="true"><i class="glow"></i><i class="glow g2"></i></div>
    <div class="hero">
      <h1 id="ovTitle">🚲 越野自行车</h1>
      <div class="sub" id="ovSub" hidden></div>
      <div class="heroStat" id="heroSummary" aria-label="当前进度"></div>
    </div>

    <nav class="modeTabs" id="modeTabs" aria-label="玩法">
      <button class="mtab is-on" data-mode="level" type="button" aria-selected="true">🏁 闯关</button>
      <button class="mtab" data-mode="race" type="button" aria-selected="false">🏆 比赛</button>
      <button class="mtab" data-mode="ranked" type="button" aria-selected="false">🏆 排位</button>
      <button class="mtab" data-mode="free" type="button" aria-selected="false">♾️ 无限</button>
    </nav>

    <section id="homeView" class="homeView" aria-label="关卡地图"></section>

    <nav class="menuFoot" aria-label="养成与设置">
      <button class="fbtn" id="btnGarage" data-entry="garage" type="button"><b>🏍️</b><span>车库</span></button>
      <button class="fbtn" id="btnShop" data-entry="shop" type="button"><b>🔧</b><span>升级</span></button>
      <button class="fbtn" id="btnAch" data-entry="ach" type="button"><b>🏅</b><span>成就</span></button>
      <button class="fbtn" id="btnSave" data-entry="save" type="button"><b>💾</b><span>存档</span></button>
      <button class="fbtn" id="btnSettings" data-entry="settings" type="button"><b>⚙️</b><span>设置</span></button>
    </nav>

    <div id="modePanel" class="hidden"></div>
  </div>

  <div id="shop" class="hidden">
    <h2 id="shopTitle">🛠 升级车间</h2>
    <div class="upGold">🪙 金币 <span id="shopGold">0</span></div>
    <div class="upItm"><div class="upT">⚙️ 引擎</div><div class="upD">爬坡力 / 极速 / 油耗</div><div class="upL" id="lv-engine">Lv0</div><button class="btn sm" data-buy="engine">升级</button></div>
    <div class="upItm"><div class="upT">🛞 轮胎</div><div class="upD">抓地 / 防滑 / 极速</div><div class="upL" id="lv-tire">Lv0</div><button class="btn sm" data-buy="tire">升级</button></div>
    <div class="upItm"><div class="upT">🛡️ 车架</div><div class="upD">倒立容错 · 贴地即摔</div><div class="upL" id="lv-frame">Lv0</div><button class="btn sm" data-buy="frame">升级</button></div>
    <div class="upItm"><div class="upT">🛠️ 减震</div><div class="upD">落地缓冲 / 更稳</div><div class="upL" id="lv-susp">Lv0</div><button class="btn sm" data-buy="susp">升级</button></div>
    <div class="upUltra" id="shopUltra"></div>
    <div class="upNote" id="shopNote"></div>
    <button class="btn" id="closeShop">返回</button>
  </div>

  <div id="settings" class="hidden">
    <h2>⚙️ 设置</h2>
    <div class="setGrp">🎚 画质</div>
    <div class="qualityTabs tabs" id="qualityTabs" role="tablist" aria-label="画质档位">
      <button class="tab" data-q="low" role="tab" aria-selected="true">低</button>
      <button class="tab" data-q="medium" role="tab" aria-selected="false">中</button>
      <button class="tab" data-q="high" role="tab" aria-selected="false">高</button>
    </div>
    <div class="setNote" id="qDesc"></div>
    <div class="setGrp">🔊 声音</div>
    <button class="btn sm" id="btnMute">🔊 声音开启</button>
    <div class="setGrp">☕ 支持</div>
    <button class="btn sm ghost" id="btnDonate">请我喝咖啡</button>
    <div class="setFoot"><button class="btn" id="closeSettings">返回</button></div>
  </div>

  <div id="donate" class="hidden">
    <h2>☕ 一杯咖啡</h2>
    <div class="dntText">
      这个小游戏完全免费，没有广告，也没有内购。玩得开心就是最好的回馈。<br>
      如果你愿意，可以留下一杯咖啡 ☕，作为对作者的鼓励。<br>
      祝你一路顺风不摔车 🙂
    </div>
    <div class="qrBox" id="qrBox"><span>把你的收款二维码保存为 <b>assets/qr.png</b>，游戏里就会自动显示</span><img id="qrImg" src="assets/qr.png" alt="收款二维码"></div>
    <div class="dntTip">（二维码只在本地显示，不会上传到任何地方）</div>
    <button class="btn" id="closeDonate">返回</button>
  </div>
</div>

<!-- 原生 ES module 直连：零依赖、零构建，任意静态服务器（含 GitHub Pages）直接运行。
     本地调试：node tools/_serve.mjs  →  http://localhost:8765
     注意：file:// 下浏览器会以 CORS 拦截 module 加载，请勿直接双击打开。 -->
<script type="module" src="src/main.js"></script>
</body>
</html>
