<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>canvas test</title></head>
<body style="background:#223;">
<canvas id="cv" width="320" height="200" style="width:320px;height:200px"></canvas>
<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
ctx.fillStyle = "#ff0000";
ctx.fillRect(0, 0, 160, 100);
ctx.fillStyle = "#00ff00";
ctx.fillRect(160, 0, 160, 100);
ctx.fillStyle = "#0000ff";
ctx.fillRect(0, 100, 320, 100);
if (typeof cv.roundRect === "function") {
  ctx.fillStyle = "#ff0";
  ctx.beginPath();
  ctx.roundRect(60, 140, 40, 30, 8);
  ctx.fill();
}
document.title = "roundRect=" + (typeof ctx.roundRect === "function");
</script>
</body></html>
