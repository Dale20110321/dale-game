<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>自动进入游戏（调试用）</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/main.css">
<style>body { background: #2a1f3d; } #diag { position: fixed; top: 0; left: 0; right: 0; z-index: 99; background: #000e; color: #0f0; font: 16px monospace; padding: 8px 12px; white-space: pre-wrap; }</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="touch" class="hidden">
    <button class="tbtn tleft" data-k="left" aria-label="刹车 / 空中逆时针转体">◀</button>
    <button class="tbtn tright" data-k="right" aria-label="加速 / 空中顺时针转体">▶</button>
  </div>
  <button id="fullBtn" class="tbtn tfull" aria-label="全屏">⛶</button>
  <button id="touchBtn" class="tbtn ttoggle" aria-label="方向键开关">🎮</button>
  <div id="comboTag"></div>
  <div id="toast"></div>
  <div id="overlay" class="hidden">
    <div id="menuBg" aria-hidden="true"><i class="glow"></i><i class="glow g2"></i></div>
    <div class="hero">
      <h1 id="ovTitle">🚲 越野自行车</h1>
      <div class="sub" id="ovSub"></div>
      <div class="heroSummary" id="heroSummary" aria-label="当前状态摘要"></div>
      <div class="keys" id="ovKeys"></div>
    </div>
    <div class="menuGroups" id="menuGroups">
      <div class="menuGroup" data-group="main" aria-label="主玩法">
        <div class="grpHead">主玩法</div>
        <div class="grpBtns">
          <button class="btn lg" id="btnLevels" data-entry="levels">🏁 闯关</button>
          <button class="btn ghost" id="btnRace" data-entry="race">🏆 比赛模式</button>
          <button class="btn ghost" id="btnFinale" data-entry="finale">🎯 最终任务</button>
          <button class="btn ghost" id="btnRanked" data-entry="ranked">🏆 排位赛</button>
          <button class="btn ghost" id="btnFree" data-entry="free">♾️ 无限模式</button>
        </div>
      </div>
      <div class="menuGroup" data-group="progress" aria-label="养成与进度">
        <div class="grpHead">养成与进度</div>
        <div class="grpBtns">
          <button class="btn ghost" id="btnGarage" data-entry="garage">🏍️ 车库</button>
          <button class="btn ghost" id="btnShop" data-entry="shop">🔧 升级车间</button>
          <button class="btn ghost" id="btnAch" data-entry="ach">🏅 成就</button>
          <button class="btn ghost" id="btnSave" data-entry="save">💾 存档</button>
        </div>
      </div>
      <div class="menuGroup" data-group="support" aria-label="支持">
        <div class="grpHead">支持</div>
        <div class="grpBtns">
          <button class="btn" id="btnDonate" data-entry="donate">☕ 你喜欢这个游戏吗</button>
        </div>
      </div>
    </div>
    <div id="modePanel" class="hidden"></div>
  </div>
  <div id="shop" class="hidden">
    <h2 id="shopTitle">🛠 升级车间</h2>
    <div class="upGold">🪙 金币 <span id="shopGold">0</span></div>
    <div class="upItm"><div class="upT">⚙️ 引擎</div><div class="upD">爬坡力 / 极速 / 油耗</div><div class="upL" id="lv-engine">Lv0</div><button class="btn sm" data-buy="engine">升级</button></div>
    <div class="upItm"><div class="upT">🛞 轮胎</div><div class="upD">抓地 / 防滑 / 极速</div><div class="upL" id="lv-tire">Lv0</div><button class="btn sm" data-buy="tire">升级</button></div>
    <div class="upItm"><div class="upT">🛡️ 车架</div><div class="upD">倒立容错 · 贴地即摔</div><div class="upL" id="lv-frame">Lv0</div><button class="btn sm" data-buy="frame">升级</button></div>
    <div class="upItm"><div class="upT">🛠️ 减震</div><div class="upD">落地缓冲 / 更稳</div><div class="upL" id="lv-susp">Lv0</div><button class="btn sm" data-buy="susp">升级</button></div>
    <div class="upNote" id="shopNote"></div>
    <button class="btn" id="closeShop">返回</button>
  </div>
  <div id="donate" class="hidden">
    <h2>☕ 一杯咖啡</h2>
    <div class="dntText">调试页面</div>
    <div class="qrBox" id="qrBox"><span>QR</span><img id="qrImg" src="assets/qr.png" alt="收款二维码"></div>
    <div class="dntTip"></div>
    <button class="btn" id="closeDonate">返回</button>
  </div>
</div>
<div id="diag">loading…</div>
<script>
window.addEventListener("error", (e) => {
  document.body.style.background = "#800";
  const d = document.getElementById("diag");
  d.style.background = "#c00";
  d.style.color = "#ff0";
  d.textContent = "GLOBAL ERR: " + e.message + " @ " + (e.filename || "") + ":" + (e.lineno || 0);
});
window.addEventListener("unhandledrejection", (e) => {
  document.body.style.background = "#804";
  const d = document.getElementById("diag");
  d.style.background = "#c00";
  d.style.color = "#ff0";
  d.textContent = "REJECT: " + (e.reason && e.reason.stack || e.reason);
});
</script>
<script type="module" src="src/main.js"></script>
<script type="module">
import { startGame, stepper } from "./src/main.js";
import { drawScene } from "./src/render/scene.js";
const diag = () => {
  const cv = document.getElementById("cv");
  const st = window.__st;
  document.getElementById("diag").textContent =
    `cv=${cv.width}x${cv.height} state=${st ? st.state : "?"} t=${st ? st.time.toFixed(1) : "?"} x=${(st && st.bike && st.bike.rear.x.toFixed(0)) || "?"} theme=${(st && st.phys && st.phys.theme) ?? "?"}`;
};
try {
  startGame("level", 0);
  const src = await import("./src/core/store.js");
  window.__st = src.store;
  diag();
  // 同步驱动 240 帧（4 秒游戏时间），不依赖 RAF
  for (let i = 0; i < 240; i++) {
    stepper.advance(1 / 60);
    drawScene();
  }
  diag();
  // 用 body 背景色编码诊断：蓝=canvas宽0 / 绿=canvas有宽 / 红=抛错
  const cv = document.getElementById("cv");
  const cvw = await import("./src/core/canvas.js");
  if (!cv.width) {
    document.body.style.background = "#0000cc";
  } else if (cvw.view.W < 100) {
    document.body.style.background = "#cc00cc";
  } else if (window.__st.state === "play") {
    document.body.style.background = "#006600";
  } else {
    document.body.style.background = "#cc8800";
  }
  // 把诊断画到 canvas 上，截图可见
  const tctx = cv.getContext("2d");
  tctx.fillStyle = "#000";
  tctx.fillRect(0, 0, 1100, 60);
  tctx.fillStyle = "#fff";
  tctx.font = "18px monospace";
  tctx.fillText(
    `W=${cvw.view.W} H=${cvw.view.H} cv=${cv.width}x${cv.height} iw=${window.innerWidth} ih=${window.innerHeight} dpr=${window.devicePixelRatio}`,
    8, 22
  );
  tctx.fillText(
    `state=${window.__st.state} t=${window.__st.time.toFixed(1)} x=${window.__st.bike.rear.x.toFixed(0)} theme=${window.__st.phys.theme}`,
    8, 44
  );
  document.getElementById("diag").textContent += " frames=240";
} catch (err) {
  document.body.style.background = "#800";
  document.getElementById("diag").textContent = "ERR: " + err.stack;
  console.error(err);
}
</script>
</body>
</html>
